[project]
name = "article-analyzer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "arxiv>=4.0.1",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "openai>=3.40.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "tokenizers>=0.23.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
article-analyzer = "article_analyzer:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
